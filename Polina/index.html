<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Особенный момент</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <main class="gift-card">

        <div class="top-line"></div>

        <header class="header">
            <p class="eyebrow">A MOMENT TO REMEMBER</p>

            <h1>Для тебя</h1>

            <div class="divider"></div>

            <p class="intro">
                Иногда самые простые моменты
                становятся самыми дорогими воспоминаниями.
            </p>
        </header>

        <section class="video-section">

            <div class="video-frame">
                <video controls playsinline preload="metadata">
                    <source src="./video/viddeo.mp4" type="video/mp4">
                    Ваш браузер не поддерживает воспроизведение видео.
                </video>
            </div>

            <p class="video-caption">
                Один момент. Одна история. Одно воспоминание.
            </p>

        </section>

        <section class="message-section">

            <div class="ornament"></div>

            <p class="message">
                Некоторые вещи не требуют
                <br>
                особенных слов.
            </p>

            <p class="sub-message">
                Просто сохрани этот момент.
            </p>

        </section>

        <footer class="footer">
            <span class="footer-line"></span>
            <p>С теплом и уважением</p>
            <span class="footer-line"></span>
        </footer>

    </main>

</body>
</html>
